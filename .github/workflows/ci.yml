# Lifecycle-aware validation inherited from playbook-engineering ENG-0004.
# Repository Actions Policy is the primary actor/fork boundary; the immutable
# policy action below is a second, fail-closed check before repository code runs.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      purpose:
        description: Why the complete suite is being run manually
        required: true
        type: choice
        options:
          - exact-sha-preflight
          - diagnostics
          - release-recovery
          - workflow-testing
          - explicit-rerun

permissions:
  actions: read # Exact-SHA evidence queries inspect prior workflow jobs.
  contents: read # Checkout reads the selected exact commit.
  pull-requests: read # Evidence and acceptance gates inspect PR metadata.

# A skipped converted-to-draft run still replaces an obsolete ready-PR run.
# Queue candidates are isolated by their synthetic head ref; main pushes never
# cancel each other because every exact merged SHA must retain a verdict.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('merge-group-{0}', github.event.merge_group.head_ref) || github.event_name == 'workflow_dispatch' && format('manual-{0}', github.sha) || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  policy:
    name: Action Policy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      run_full: ${{ steps.policy.outputs.run_full }}
      run_post_merge: ${{ steps.policy.outputs.run_post_merge }}
    steps:
      - id: policy
        # ENG-0004 requires this reviewed immutable commit even though it has no release tag.
        uses: qwts/playbook-engineering/.github/actions/ci-policy@dd4bf511ac8305c412a0c3e23a702b3f55795967 # zizmor: ignore[stale-action-refs]

  merge-evidence:
    name: Verify merged commit evidence
    needs: policy
    if: needs.policy.outputs.run_post_merge == 'true'
    runs-on: ubuntu-latest
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find a successful complete suite for this exact merged SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and (.event == "merge_group" or .event == "push") and .conclusion == "success") | .id) // empty')
          validated=false
          if [ -n "$run_id" ]; then
            validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  preflight-evidence:
    name: Verify preflight evidence
    needs: policy
    if: github.event_name == 'pull_request' && needs.policy.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find a successful manual complete suite for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&head_sha=$TARGET_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
          validated=false
          if [ -n "$run_id" ]; then
            validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  complete:
    name: Complete suite
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.mode == 'full' && needs.preflight-evidence.outputs.validated != 'true') ||
      needs.policy.outputs.mode == 'queue' || needs.policy.outputs.mode == 'manual' ||
      (needs.policy.outputs.mode == 'post-merge' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INTEROP_PHOTOS_ROOT: ${{ github.workspace }}/node_modules/.interop-photos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep the companion checkout under the ignored dependency tree so repo
      # lint/format tooling sees only Image Trail while the acceptance gate can
      # read the pinned cross-repository evidence.
      - name: Checkout pinned Overlook acceptance evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qwts/overlook
          ref: 723729d50d63af085502e68cc1377c54a85f1595
          path: node_modules/.interop-photos
          persist-credentials: false

      - name: Version policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:version-policy

      - name: Run tokenless repository validation
        env:
          NODE_OPTIONS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=node-test-github-reporter --test-reporter-destination=stdout
        run: npm run ci:tokenless

      - name: Verify pinned cross-repository interop evidence
        run: npm run check:interop-acceptance:cross-repo

      - name: Acceptance coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:acceptance-coverage

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: npm run coverage:summary

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info

      - name: Install Playwright browser for Storybook
        run: npx playwright install --with-deps chromium

      - name: Storybook interaction tests
        run: npm run test:stories:ci

  e2e:
    name: E2E
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.mode == 'full' && needs.preflight-evidence.outputs.validated != 'true') ||
      needs.policy.outputs.mode == 'queue' || needs.policy.outputs.mode == 'manual' ||
      (needs.policy.outputs.mode == 'post-merge' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  codeql:
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      (needs.policy.outputs.mode == 'queue' || needs.policy.outputs.mode == 'manual' ||
      needs.policy.outputs.mode == 'post-merge' ||
      (needs.policy.outputs.mode == 'full' && needs.preflight-evidence.outputs.validated != 'true'))
    permissions:
      actions: read # CodeQL reads workflow metadata during analysis.
      contents: read # CodeQL checks out and scans the selected commit.
      packages: read # CodeQL may resolve packages referenced by the build.
      security-events: write # CodeQL uploads SARIF for the analyzed commit.
    uses: ./.github/workflows/codeql.yml

  zizmor:
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.mode == 'full' && needs.preflight-evidence.outputs.validated != 'true') ||
      needs.policy.outputs.mode == 'queue' || needs.policy.outputs.mode == 'manual' ||
      (needs.policy.outputs.mode == 'post-merge' && needs.merge-evidence.outputs.validated != 'true'))
    uses: ./.github/workflows/zizmor.yml

  post-merge:
    name: Post-merge smoke
    needs: [policy, merge-evidence]
    if: needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Extension smoke
        run: npm run test:e2e -- tests/e2e/extension-smoke.spec.ts

  e2e-gate:
    name: E2E gate
    needs: [policy, merge-evidence, preflight-evidence, e2e]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce E2E evidence for the selected lane
        env:
          MODE: ${{ needs.policy.outputs.mode }}
          POLICY: ${{ needs.policy.result }}
          E2E: ${{ needs.e2e.result }}
          PREFLIGHT: ${{ needs.preflight-evidence.result }}
          PREFLIGHT_VALIDATED: ${{ needs.preflight-evidence.outputs.validated }}
          MERGE_VALIDATED: ${{ needs.merge-evidence.outputs.validated }}
        run: |
          test "$POLICY" = success
          case "$MODE" in
            full)
              if [ "$PREFLIGHT_VALIDATED" = true ]; then
                test "$PREFLIGHT" = success
              else
                test "$E2E" = success
              fi
              ;;
            queue|manual) test "$E2E" = success ;;
            post-merge)
              if [ "$MERGE_VALIDATED" = true ]; then
                test "$E2E" = skipped
              else
                test "$E2E" = success
              fi
              ;;
            *) exit 1 ;;
          esac

  gate:
    name: CI
    needs: [policy, merge-evidence, preflight-evidence, complete, e2e-gate, codeql, zizmor, post-merge]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce the selected lifecycle lane
        env:
          MODE: ${{ needs.policy.outputs.mode }}
          POLICY: ${{ needs.policy.result }}
          COMPLETE: ${{ needs.complete.result }}
          E2E_GATE: ${{ needs.e2e-gate.result }}
          CODEQL: ${{ needs.codeql.result }}
          ZIZMOR: ${{ needs.zizmor.result }}
          PREFLIGHT: ${{ needs.preflight-evidence.result }}
          PREFLIGHT_VALIDATED: ${{ needs.preflight-evidence.outputs.validated }}
          MERGE_VALIDATED: ${{ needs.merge-evidence.outputs.validated }}
          POST_MERGE: ${{ needs.post-merge.result }}
        run: |
          test "$POLICY" = success
          case "$MODE" in
            full)
              if [ "$PREFLIGHT_VALIDATED" = true ]; then
                test "$PREFLIGHT" = success
              else
                test "$COMPLETE" = success
                test "$CODEQL" = success
                test "$ZIZMOR" = success
              fi
              test "$E2E_GATE" = success
              ;;
            queue|manual)
              test "$COMPLETE" = success
              test "$E2E_GATE" = success
              test "$CODEQL" = success
              test "$ZIZMOR" = success
              ;;
            post-merge)
              test "$CODEQL" = success
              test "$E2E_GATE" = success
              if [ "$MERGE_VALIDATED" = true ]; then
                test "$POST_MERGE" = success
              else
                test "$COMPLETE" = success
                test "$ZIZMOR" = success
              fi
              ;;
            *) exit 1 ;;
          esac
