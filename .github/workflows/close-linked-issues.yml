name: Close linked issues

on:
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: close-linked-issues-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  policy:
    name: Action Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: qwts/playbook-engineering/.github/actions/ci-policy@40d1c46756ba70ef40d1b56915d1cdd45b8efa85 # zizmor: ignore[stale-action-refs]
        with:
          authorization-only: 'true'

  close-linked-issues:
    name: Close linked issues
    # Keep in sync with TARGET_BASE_REFS in scripts/close-linked-issues.mjs.
    if: |
      needs.policy.result == 'success' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Required by checkout.
      issues: write # Required to close issues referenced by the merged PR.
      pull-requests: read # Required to inspect the merged PR's closing references.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Close issues referenced by merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/close-linked-issues.mjs
