name: Workflow security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repository Actions allowlist rejects zizmor's wrapper action before
      # a job starts. Install the official release archive directly and verify
      # its GitHub-published digest before executing it.
      - name: Install zizmor
        env:
          ZIZMOR_SHA256: e87b67160194884e375a46a12c57ccc904f762b53845f254fab7f17d98809c09
          ZIZMOR_URL: https://github.com/zizmorcore/zizmor/releases/download/v1.28.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zizmor.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 "$ZIZMOR_URL" --output "$archive"
          printf '%s  %s\n' "$ZIZMOR_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/zizmor" --version)" = 'zizmor 1.28.0'

      - name: Audit GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/zizmor" --persona auditor --format github \
            --config .github/zizmor.yml .
