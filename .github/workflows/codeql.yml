# Advanced CodeQL runs only through the governed CI lifecycle. This preserves
# the two languages covered by the repository's previous dynamic default setup.
name: CodeQL

on:
  workflow_call:

permissions: {}

# Jobs run on the organisation's own runners: the Linux runner group holds one
# x86-64 runner, the MacOS group one arm64 runner. A fork's pull request and a
# merge-queue run keep a hosted runner, because a pull request controls the
# workflow file it runs and would otherwise execute its own code on the
# organisation's hardware.
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ fromJSON((github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork) && '["ubuntu-latest"]' || '["self-hosted", "Linux", "X64"]') }}
    timeout-minutes: 30
    permissions:
      actions: read # CodeQL reads workflow metadata during analysis.
      contents: read # Checkout and CodeQL scan the selected commit.
      packages: read # CodeQL may resolve packages referenced by the build.
      security-events: write # Analyze uploads SARIF for the selected commit.
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # The organisation's Linux runner does not carry Node on its default PATH.
      # This step reaches for `node`, or runs an action that does, so the
      # runtime is installed first, with the same pinned action the rest of
      # the workflow already uses.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
