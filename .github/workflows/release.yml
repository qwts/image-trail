name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing exact v<package-version> tag to package and release'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Normally started by the tag trigger: version-cut.yml pushes the version tag under
# RELEASE_TOKEN, so the push emits this run on its own (a GITHUB_TOKEN push would emit nothing,
# and a bot dispatch is refused by the Actions actor policy). The same trigger covers tags pushed
# by humans; workflow_dispatch remains the recovery path for a tag whose release run never
# happened. Every build checks out the tag, never main.
# This workflow packages and publishes GitHub Release assets only. It does not merge version
# PRs or submit to the Chrome Web Store.
permissions:
  contents: write

jobs:
  release:
    name: Validate and cut release
    runs-on: ubuntu-latest
    env:
      INTEROP_PHOTOS_ROOT: ${{ github.workspace }}/node_modules/.interop-photos
    steps:
      - name: Resolve release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be stable three-component semver with a v prefix, got $tag." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Require tagged source to be on main
        env:
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: git merge-base --is-ancestor "$(git rev-list -n 1 "$TAG_NAME")" origin/main

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm ci replaces node_modules, so the pinned evidence checkout must follow it.
      - name: Checkout pinned Photos acceptance evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qwts/photos
          ref: 760e23ba1abeaf15bf6d56e029ebdd47d521a7e7
          path: node_modules/.interop-photos

      - name: Run required validation
        run: npm run ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke-test hardened release build
        run: npm run test:e2e:release

      - name: Build and package release
        run: npm run package:release -- --tag "${{ steps.release.outputs.tag }}"

      - name: Create or refresh GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --prerelease
            gh release upload "$TAG_NAME" release/*.zip release/*.sha256 --clobber
          else
            gh release create "$TAG_NAME" release/*.zip release/*.sha256 \
              --verify-tag \
              --generate-notes \
              --prerelease \
              --title "Image Trail $TAG_NAME"
          fi
