# Advisory semantic check (agentic-code-analysis, issue qwts/agentic-code-analysis#6;
# routed per qwts/image-trail#838). Advisory only — findings are informational;
# promotion to --enforce is a separate owner decision. The size ratchet is
# untouched; the contract is conjunctive (ratchet AND semantic check).
#
# Judge routing policy (owner, 2026-08-18): CI screening spends the Hugging
# Face router (Qwen), never the Anthropic key. Anthropic is reserved for
# qualification/adjudication via agentic-code-analysis's dispatch-only
# calibrate workflow. An absent HF_TOKEN skips screening rather than failing.
name: aca
on:
  pull_request:
permissions:
  contents: read
# One advisory run per PR; a newer push obsoletes the in-flight judgment.
concurrency:
  group: aca-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  context-footprint:
    # Repo policy: draft PRs start no Actions jobs (same guard as ci.yml).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: qwts/playbook-engineering/.github/workflows/semantic-ratchet.yml@68b920af61725d3107e9a7d4c151f7c06616bda4 # main 2026-08-18; bump deliberately
    with:
      model: Qwen/Qwen3-235B-A22B-Instruct-2507
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
