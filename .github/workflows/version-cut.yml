# Version-cut automation (#501), mirroring qwts/photos:
#
#  1. version-pr — while changesets are pending, keep one rolling version PR
#     open and current. Merging that PR is the human "cut a release" action.
#  2. tag — after the version PR merges (package version changed, no pending
#     changesets), tag v<version> and hand off to the release workflow.
#
# Both halves authenticate with RELEASE_TOKEN, for two compounding reasons:
#  - GITHUB_TOKEN events cannot trigger other workflows. The bot-refreshed
#    version PR got no pull_request CI runs even though main requires the "CI"
#    and "E2E gate" checks, and a GITHUB_TOKEN tag push fired no on:push:tags
#    run, so both had to be dispatched explicitly.
#  - This account's Actions policy authorizes actors explicitly and does not
#    include github-actions[bot]. Anything it triggers — including those
#    explicit dispatches — now dies at startup with "Actor is not allowed to
#    trigger Actions workflows", so the workaround stopped working too.
# Under the PAT the actor is an authorized account and both events fire on their
# own: the version PR gets real pull_request runs, and the tag push starts
# release.yml directly. The PAT reaches only actions/* steps and our own `run:`
# blocks — never a third-party action, which is why versioning is a script here
# rather than changesets/action. If RELEASE_TOKEN is ever absent the jobs fall
# back to GITHUB_TOKEN and still version and tag correctly; only the downstream
# runs fail to start (re-dispatching by hand is not a fallback, because the bot
# cannot dispatch either).
name: Version cut

on:
  push:
    branches:
      - main
  # Manual refresh / recovery for a cut whose tag or release dispatch failed.
  workflow_dispatch:

concurrency:
  group: version-cut
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version-pr:
    name: Version packages PR
    runs-on: ubuntu-latest
    # These scopes exist only for the `|| github.token` fallback below; a PAT
    # carries its own.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Credentials for the version-branch force-push below.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Done in-repo rather than by changesets/action: the step has to run under
      # RELEASE_TOKEN (see the header), and the PAT never goes to a third-party
      # action whose future versions nobody here controls. `changeset:version` is
      # the same script the action was configured to shell out to, so manifest
      # and lockfile stay synchronized with package.json exactly as before.
      - name: Create or refresh the ready version PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          BRANCH: changeset-release/main
        run: |
          set -euo pipefail
          if [ -z "$(find .changeset -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "No changesets pending — nothing to version."
            exit 0
          fi
          npm run changeset:version
          version="$(node -p "require('./package.json').version")"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo '::warning::Changesets are pending but "changeset:version" changed nothing.'
            exit 0
          fi
          git commit -m 'chore: version Image Trail'
          # The branch is a disposable projection of main + the pending
          # changesets, rebuilt from the current tip on every main push.
          git push --force origin "$BRANCH"
          open=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "Version PR #$open is open; the force-push refreshed it."
            exit 0
          fi
          {
            echo "Merging this PR cuts \`v$version\`: the tag and the release build follow automatically."
            echo
            echo "Do not hand-edit — every push to main rebuilds this branch from the pending changesets."
            echo
            echo '## Changelog'
            echo
            awk -v ver="$version" '
              $0 ~ "^## " ver "$" { grab = 1; next }
              grab && /^## / { exit }
              grab { print }
            ' CHANGELOG.md
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base main --head "$BRANCH" --title 'chore: version Image Trail' \
            --body-file "$RUNNER_TEMP/pr-body.md"

  tag:
    name: Tag version merges
    runs-on: ubuntu-latest
    # Scopes for the `|| github.token` fallback only; `actions: write` covers the
    # stranded-tag recovery dispatch below.
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The tag push has to start release.yml by itself, so it must carry the
          # PAT's credentials rather than GITHUB_TOKEN's.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Tag when the current version is a fresh cut
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # A normal main push is a release cut only when package.json changed.
          # Manual dispatch is recovery-only and still must pass the pending,
          # synchronized-version, and existing-tag checks below.
          if [ "$EVENT_NAME" = "push" ]; then
            prev=$(git show 'HEAD~1:package.json' 2>/dev/null | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version' 2>/dev/null || echo '')
            cur=$(node -p 'require("./package.json").version')
            if [ "$prev" = "$cur" ]; then
              echo "Version unchanged ($cur) — not a version-cut merge."
              exit 0
            fi
          fi

          pending=$(find .changeset -name '*.md' ! -name 'README.md' | head -1)
          if [ -n "$pending" ]; then
            echo "Changesets pending — nothing to tag."
            exit 0
          fi

          version=$(node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const manifest = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const version = String(pkg.version);
            if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)) {
              throw new Error(`package version is not stable three-component semver: ${version}`);
            }
            if (manifest.version !== version || lock.version !== version || lock.packages?.[""]?.version !== version) {
              throw new Error("package, manifest, and lockfile versions are not synchronized");
            }
            process.stdout.write(`v${version}`);
          ')

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version already tagged."
            # The one dispatch that survives: an already-existing tag has no push
            # event left to replay. Runs under the PAT — a github-actions[bot]
            # dispatch is refused by the Actions actor policy.
            if ! gh release view "$version" >/dev/null 2>&1; then
              echo "$version has no release — dispatching recovery."
              gh workflow run release.yml --ref main -f tag="$version"
            fi
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$version" -m "Image Trail $version"
          git push origin "$version"
          echo "Tagged $version."

          # No dispatch: pushed under the PAT, this tag fires release.yml's
          # on:push:tags trigger directly. Without RELEASE_TOKEN the push is a
          # GITHUB_TOKEN push and starts nothing — re-run this workflow via
          # workflow_dispatch once the secret is present and the already-tagged
          # recovery path above picks the tag up.
