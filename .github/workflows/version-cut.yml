# Version-cut automation (#501), mirroring qwts/photos:
#
#  1. version-pr — while changesets are pending, keep one rolling version PR
#     open and current. Merging that PR is the human "cut a release" action.
#  2. tag — after the version PR merges (package version changed, no pending
#     changesets), tag v<version> and hand off to the release workflow.
#
# Branch, PR, and tag writes authenticate as chores-dumb[bot], using a GitHub
# App installation token minted for each run. No human credential is used. The
# bot credential is needed for two compounding reasons:
#  - GITHUB_TOKEN events cannot trigger other workflows. The bot-refreshed
#    version PR got no pull_request CI runs even though main requires the "CI"
#    and "E2E gate" checks, and a GITHUB_TOKEN tag push fired no on:push:tags
#    run, so both had to be dispatched explicitly.
#  - This account's Actions policy authorizes actors explicitly and does not
#    include github-actions[bot]. Anything it triggers — including those
#    explicit dispatches — now dies at startup with "Actor is not allowed to
#    trigger Actions workflows", so the workaround stopped working too.
# Under the App the actor is an authorized non-human account and both events
# fire on their own: the version PR gets real pull_request runs, and the tag
# push starts release.yml directly. The workflow verifies the exact same-repo
# rolling head and base before writing, then creates or refreshes that PR. PR
# authorship is an outcome of the credential, not a separate trust boundary.
#
# Repository credentials reach only actions/* steps and our own `run:` blocks
# — never a third-party action, which is why versioning is a script here rather
# than changesets/action. App minting is mandatory: if it fails, the workflow
# stops before touching the rolling branch, PR, or release tag.
name: Version cut

on:
  push:
    branches:
      - main
  # Default-branch-only refresh / recovery. Unlike workflow_dispatch, a
  # repository_dispatch cannot select an untrusted branch's workflow file.
  repository_dispatch:
    types:
      - version-cut-recovery

concurrency:
  group: version-cut
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-version-pr:
    name: Prepare version packages PR
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.version.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Dependency code runs only in this read-only job. The next job starts on
      # a clean runner and accepts only the narrow version patch validated here.
      - name: Prepare the version patch
        id: version
        run: |
          set -euo pipefail
          if [ -z "$(find .changeset -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "No changesets pending — nothing to version."
            exit 0
          fi
          npm run changeset:version
          git add -A
          if git diff --cached --quiet; then
            echo '::warning::Changesets are pending but "changeset:version" changed nothing.'
            exit 0
          fi
          node scripts/validate-version-cut.mjs
          git diff --cached --check
          git diff --cached --binary --full-index --no-renames HEAD > "$RUNNER_TEMP/version.patch"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Upload the version patch
        if: steps.version.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: version-cut-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/version.patch
          if-no-files-found: error
          retention-days: 1

  publish-version-pr:
    name: Publish version packages PR
    needs: prepare-version-pr
    if: needs.prepare-version-pr.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required only by checkout; writes use the App token.
    steps:
      - name: Mint the chores-dumb token
        id: chores
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CHORES_DUMB_CLIENT_ID }}
          private-key: ${{ secrets.CHORES_DUMB_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout the trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the version patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: version-cut-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/version-cut

      # No package install or dependency code runs on this runner. Validate the
      # untrusted patch before committing, and disable hooks explicitly so the
      # authenticated step cannot inherit executable Git state.
      - name: Apply and validate the version patch
        id: version
        env:
          BRANCH: changeset-release/main
        run: |
          set -euo pipefail
          trusted_validator="$RUNNER_TEMP/trusted-validate-version-cut.mjs"
          cp scripts/validate-version-cut.mjs "$trusted_validator"
          git checkout -B "$BRANCH"
          git apply --index "$RUNNER_TEMP/version-cut/version.patch"
          node "$trusted_validator"
          git diff --cached --check
          version="$(node -p "require('./package.json').version")"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false commit -m 'chore: version Image Trail'
          {
            echo "Merging this PR cuts \`v$version\`: the tag and the release build follow automatically."
            echo
            echo "Do not hand-edit — every push to main rebuilds this branch from the pending changesets."
            echo
            echo '## Changelog'
            echo
            awk -v ver="$version" '
              $0 ~ "^## " ver "$" { grab = 1; next }
              grab && /^## / { exit }
              grab { print }
            ' CHANGELOG.md
          } > "$RUNNER_TEMP/pr-body.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify the ready version PR
        id: version_pr
        env:
          GH_TOKEN: ${{ steps.chores.outputs.token }}
          BRANCH: changeset-release/main
        run: |
          set -euo pipefail
          pr_numbers=$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open \
              -f head="$GITHUB_REPOSITORY_OWNER:$BRANCH" \
              -f base=main \
              --paginate \
              --jq '.[].number'
          )
          open_prs=()
          if [ -n "$pr_numbers" ]; then
            mapfile -t open_prs <<< "$pr_numbers"
          fi
          if [ "${#open_prs[@]}" -gt 1 ]; then
            echo "::error::Refusing to refresh ${#open_prs[@]} open PRs for $BRANCH."
            exit 1
          fi
          open="${open_prs[0]:-}"
          if [ -z "$open" ]; then
            echo 'missing=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'missing=false' >> "$GITHUB_OUTPUT"
          echo "number=$open" >> "$GITHUB_OUTPUT"

      - name: Push the version branch
        env:
          GH_TOKEN: ${{ steps.chores.outputs.token }}
          BRANCH: changeset-release/main
        run: |
          set -euo pipefail
          # The branch is a disposable projection of main + the pending
          # changesets, rebuilt from the current tip on every main push.
          gh auth setup-git
          git -c core.hooksPath=/dev/null push --force origin "$BRANCH"

      - name: Create or refresh the ready version PR
        env:
          GH_TOKEN: ${{ steps.chores.outputs.token }}
          BRANCH: changeset-release/main
          MISSING_PR: ${{ steps.version_pr.outputs.missing }}
          PR_NUMBER: ${{ steps.version_pr.outputs.number }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$MISSING_PR" = 'true' ]; then
            gh pr create --base main --head "$BRANCH" --title 'chore: version Image Trail' \
              --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Version PR created for v$VERSION."
            exit 0
          fi

          # The rolling PR outlives the changesets it was opened for. Its body
          # is regenerated on every refresh — otherwise it keeps advertising
          # the version and changelog from whenever it was first opened while
          # the branch underneath moves on (PR #704 review).
          gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/pr-body.md"
          echo "Version PR #$PR_NUMBER refreshed for v$VERSION."

  tag:
    name: Tag version merges
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required only by checkout; writes use the App token.
    steps:
      - name: Mint the chores-dumb token
        id: chores
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CHORES_DUMB_CLIENT_ID }}
          private-key: ${{ secrets.CHORES_DUMB_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag when the current version is a fresh cut
        env:
          GH_TOKEN: ${{ steps.chores.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # A normal main push is a release cut only when package.json changed.
          # Repository dispatch is recovery-only and still must pass the
          # pending, synchronized-version, and existing-tag checks below.
          if [ "$EVENT_NAME" = "push" ]; then
            prev=$(git show 'HEAD~1:package.json' 2>/dev/null | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version' 2>/dev/null || echo '')
            cur=$(node -p 'require("./package.json").version')
            if [ "$prev" = "$cur" ]; then
              echo "Version unchanged ($cur) — not a version-cut merge."
              exit 0
            fi
          fi

          pending=$(find .changeset -name '*.md' ! -name 'README.md' | head -1)
          if [ -n "$pending" ]; then
            echo "Changesets pending — nothing to tag."
            exit 0
          fi

          version=$(node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const manifest = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const version = String(pkg.version);
            if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)) {
              throw new Error(`package version is not stable three-component semver: ${version}`);
            }
            if (manifest.version !== version || lock.version !== version || lock.packages?.[""]?.version !== version) {
              throw new Error("package, manifest, and lockfile versions are not synchronized");
            }
            process.stdout.write(`v${version}`);
          ')

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version already tagged."
            # The one dispatch that survives: an already-existing tag has no push
            # event left to replay. Runs as chores-dumb[bot] because a
            # github-actions[bot] dispatch is refused by the Actions actor policy.
            if ! gh release view "$version" >/dev/null 2>&1; then
              echo "$version has no release — dispatching recovery."
              gh workflow run release.yml --ref main -f tag="$version"
            fi
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$version" -m "Image Trail $version"
          gh auth setup-git
          git push origin "$version"
          echo "Tagged $version."

          # No dispatch: pushed under the App token, this tag fires release.yml's
          # on:push:tags trigger directly. If App minting fails, the job stops
          # before creating or pushing the tag.
