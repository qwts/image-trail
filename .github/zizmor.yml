rules:
  secrets-outside-env:
    config:
      # These dedicated automation credentials are consumed only by the
      # version branch/PR/tag jobs; their triggers and permissions constrain
      # their use.
      allow:
        - CHORES_DUMB_CLIENT_ID
        - CHORES_DUMB_PRIVATE_KEY
  unpinned-uses:
    config:
      policies:
        # ENG-0004: governed shared reusable workflows intentionally track the
        # compatible v1 ref; every other action must use a full commit SHA.
        'qwts/playbook-engineering/*': ref-pin
        '*': hash-pin
