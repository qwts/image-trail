rules:
  secrets-outside-env:
    config:
      # These dedicated automation credentials are consumed only by the
      # version branch/PR/tag jobs; their triggers and permissions constrain
      # their use.
      allow:
        - CHORES_DUMB_CLIENT_ID
        - CHORES_DUMB_PRIVATE_KEY
        # Public OAuth configuration is injected only into the hardened release
        # build; the repository secret keeps it out of source control.
        - PCLOUD_CLIENT_ID
  unpinned-uses:
    config:
      policies:
        # ENG-0004 requires the shared policy action at an immutable reviewed
        # commit even when that commit has no release tag.
        '*': hash-pin
