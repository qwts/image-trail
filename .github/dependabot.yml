version: 2
updates:
  # Grouped weekly npm updates: one PR for all devDependencies instead of a PR per package.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-deps:
        patterns:
          - '*'
    ignore:
      # typescript-eslint 8.x supports TypeScript only below 6.1.
      - dependency-name: typescript
        versions:
          - '>=6.1.0'

  # Keep the pinned action versions in .github/workflows current the same way.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
    ignore:
      # ci-policy and bounded-command are authorization boundaries, not ordinary
      # dependencies. Their immutable commits advance only via the governed
      # harness sync with matching reviewed contract tests, and must never ride
      # Dependabot's catch-all action group (cf. qwts/overlook#1038).
      - dependency-name: 'qwts/playbook-engineering/.github/actions/ci-policy'
      - dependency-name: 'qwts/playbook-engineering/.github/actions/bounded-command'
