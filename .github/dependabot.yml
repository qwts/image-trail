version: 2
updates:
  # Grouped weekly npm updates: one PR for all devDependencies instead of a PR per package.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-deps:
        patterns:
          - '*'
    ignore:
      # TypeScript 7 is not install-compatible with typescript-eslint 8.x.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # Keep the pinned action versions in .github/workflows current the same way.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
